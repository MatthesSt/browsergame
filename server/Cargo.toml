[package]
name = "browsergame-server"
version = "0.1.0"
edition = "2021"
description = "Leaderboard backend for the browser game: REST + live websocket updates"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
rocket_ws = "0.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "fs", "time", "macros"] }
futures = "0.3"

[profile.release]
lto = true
codegen-units = 1
